[package]
name = "ai-youtube-shorts-generator"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Rust backend and native Rune GUI for AI-generated YouTube Shorts"
default-run = "shorts-gui"

[lib]
name = "shorts_generator"
path = "src/lib.rs"

[[bin]]
name = "shorts-generator"
path = "src/main.rs"

[[bin]]
name = "shorts-gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:rune", "rune/native-file-dialog"]

[dependencies]
base64 = "0.22"
tempfile = "3"
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

[target.'cfg(windows)'.dependencies]
rune = { git = "https://github.com/anomalyco/rune", rev = "ff8c5bfa1aa2458219c0a5e91ebc98cb34400e39", default-features = false, features = ["accessibility", "embedded-fonts"], optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[patch.crates-io]
wgpu-hal = { path = ".cargo/rune/vendor/wgpu-hal" }
winit = { path = ".cargo/rune/vendor/winit" }
sctk-adwaita = { path = ".cargo/rune/vendor/sctk-adwaita" }
parley_engine = { path = ".cargo/rune/vendor/parley_engine" }
accesskit_windows = { path = ".cargo/rune/vendor/accesskit_windows" }
accesskit_macos = { path = ".cargo/rune/vendor/accesskit_macos" }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
codegen-units = 16
lto = "thin"
strip = true
